{% extends 'base.html' %}

{% block content %}
<div style="max-width:500px;margin:50px auto;background:#ffffff;padding:35px;border-radius:20px;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);font-family:'Poppins',sans-serif;
            animation:fadeIn 0.5s ease;">
  
  <h2 style="text-align:center;color:#5e3a8c;font-weight:700;">Nueva contraseña</h2>
  <p style="text-align:center;margin-top:8px;color:#6a4c93;">
    Ingresa tu nueva contraseña para completar el proceso.
  </p>

  <form method="post" style="margin-top:20px;">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <label style="font-weight:600;color:#a85fc7;">Nueva contraseña:</label>
    {{ form.new_password1 }}

    <label style="font-weight:600;color:#a85fc7;margin-top:12px;">Confirmar contraseña:</label>
    {{ form.new_password2 }}

    <button type="submit" style="width:100%;background:linear-gradient(90deg,#ff9ecd,#c49bff);
           padding:12px;border:none;border-radius:30px;color:white;font-weight:600;font-size:1.1rem;
           cursor:pointer;margin-top:22px;">
      Guardar nueva contraseña
    </button>
  </form>

</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}
