{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomClass - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1d0a3;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .navbar-simple {
      background-color: #9c4848;
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .navbar-simple img {
      height: 60px;
      vertical-align: middle;
    }

    .navbar-simple .brand-name {
      display: inline-block;
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff;
      margin-left: 10px;
      vertical-align: middle;
    }

    .form-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px); 
      padding: 20px;
    }

    .form-box {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-box h1 {
      color: #9c4848;
      margin-bottom: 20px;
    }

    .form-box form input,
    .form-box form select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #9c4848;
      border-radius: 5px;
    }

    .form-box form button {
      width: 100%;
      padding: 10px;
      background-color: #9c4848;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-box form button:hover {
      background-color: #7a3737;
    }

    .form-box a {
      display: inline-block;
      margin-top: 15px;
      color: #9c4848;
      text-decoration: none;
      font-weight: bold;
    }

    .form-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <div class="navbar-simple">
    <img src="{% static 'img/logo.png' %}" alt="Logo BloomClass">
    <span class="brand-name">BloomClass</span>
  </div>

  
  <div class="form-container">
    <div class="form-box">
      <h1>Iniciar Sesión</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Iniciar sesión</button>
      </form>
      <a href="{% url 'register' %}">Crear cuenta</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
