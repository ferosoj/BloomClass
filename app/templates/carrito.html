{% extends 'base.html' %}

{% block content %}
<h1>Mi Carrito</h1>

{% if cursos %}
    <ul>
        {% for curso in cursos %}
        <li>{{ curso.titulo }} - ${{ curso.precio }}</li>
        {% endfor %}
    </ul>
    <p><strong>Total: ${{ total }}</strong></p>
    <form action="{% url 'comprar_carrito' %}" method="post">
        {% csrf_token %}
        <button type="submit">Comprar</button>
    </form>
{% else %}
    <p>Tu carrito está vacío.</p>
{% endif %}
{% endblock %}
