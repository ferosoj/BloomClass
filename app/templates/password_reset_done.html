{% extends 'base.html' %}

{% block content %}
<div style="max-width:500px;margin:50px auto;background:#ffffff;padding:35px;border-radius:20px;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);font-family:'Poppins',sans-serif;
            animation:fadeIn 0.4s ease;">

  <h2 style="text-align:center;color:#5e3a8c;font-weight:700;">Correo enviado</h2>

  <p style="text-align:center;margin-top:12px;color:#6a4c93;font-size:1.05rem;line-height:1.5;">
    Si el correo está registrado, recibirás un enlace para restablecer tu contraseña en unos minutos.
  </p>

  <div style="text-align:center;margin-top:25px;">
    <a href="{% url 'login' %}" 
       style="display:inline-block;padding:12px 20px;background:linear-gradient(90deg,#ff9ecd,#c49bff);
              color:white;border-radius:30px;font-weight:600;text-decoration:none;
              transition:0.3s;font-size:1.05rem;">
      Volver al inicio de sesión
    </a>
  </div>

</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}
