{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #fde2e4, #e8def8, #fff2cc, #ffd6a5);
    background-size: 300% 300%;
    animation: gradientShift 10s ease infinite;
    font-family: 'Poppins', sans-serif;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .reset-box {
    max-width: 480px;
    margin: 60px auto;
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 25px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    text-align: center;
  }

  .reset-box h2 {
    color: #5e3a8c;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .reset-box p {
    color: #6a4c93;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .reset-box label {
    display: block;
    text-align: left;
    font-weight: 600;
    margin-bottom: 6px;
    color: #a85fc7;
  }

  .reset-box input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #f3cae0;
    border-radius: 12px;
    background-color: #fffafc;
    color: #5a3d7a;
    transition: 0.3s;
  }

  .reset-box input:focus {
    border-color: #c49bff;
    box-shadow: 0 0 8px rgba(195,155,255,0.4);
    outline: none;
  }

  .reset-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #ff9ecd, #c49bff);
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 1.1rem;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s ease;
  }

  .reset-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(182, 146, 246, 0.3);
  }
</style>

<div class="reset-box">
  <h2>Recuperar contraseña</h2>
  <p>Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

  <form method="post">
    {% csrf_token %}
    <label for="id_email">Correo electrónico:</label>
    {{ form.email }}

    <button type="submit" class="reset-btn">Enviar enlace</button>
  </form>
</div>
{% endblock %}
